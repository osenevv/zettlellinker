[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "zettellinker"
version = "0.2.0"
description = "Fast, local semantic linking and graph health for Obsidian vaults"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ZettelLinker contributors" }]
dependencies = [
  "langchain>=0.3",
  "langchain-core>=0.3",
  "langgraph>=0.2",
  "numpy>=1.26",
  "platformdirs>=4.2",
  "PyYAML>=6.0",
  "sentence-transformers>=3.0",
]

[project.optional-dependencies]
usearch = ["usearch==2.16.9"]
build = ["pyinstaller>=6.11,<7"]
test = ["pytest>=8,<9", "usearch==2.16.9"]

[project.scripts]
zettellinker = "zettellinker.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/zettellinker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
